name: Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live production
        run: npm run verify:production
