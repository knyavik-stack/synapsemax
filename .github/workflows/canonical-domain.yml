name: Canonical domain guard

on:
  push:
    branches:
      - docs/project-operating-system-v1

permissions:
  contents: write

jobs:
  canonical-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/project-operating-system-v1
          fetch-depth: 1
      - name: Normalize public SynapseMax domain and email
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'hello@synapsemax.ai': 'hello@synapsemax.ru',
              'synapsemax.ai': 'synapsemax.ru',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit canonicalization when needed
        run: |
          git config user.name "SynapseMax Bot"
          git config user.email "hello@synapsemax.ru"
          git add index.html
          if git diff --cached --quiet; then
            echo "Canonical domain already correct."
          else
            git commit -m "fix: normalize canonical .ru domain and email"
            git push origin HEAD:docs/project-operating-system-v1
          fi
