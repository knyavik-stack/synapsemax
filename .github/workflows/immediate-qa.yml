name: Immediate QA

on:
  push:
    branches: ['main', 'rebase/immediate-product']
  pull_request:
    branches: ['main']

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm run build
      - run: npm run test:immediate

      - name: Verify production artifact
        run: |
          test -f dist/dex-immediate.html
          test -d dist/assets
          test -f dist/assets/synapsemax-symbol.png
          test -f dist/assets/synapsemax-wordmark.png
          grep -q 'Диагностика' dist/dex-immediate.html
          grep -q '/api/v1/assessment' dist/dex-immediate.html
          grep -q '/api/v1/roi' dist/dex-immediate.html
          grep -q 'sm-footer' dist/dex-immediate.html
          grep -q 'hello@synapsemax.ru' dist/dex-immediate.html
          grep -q 'Данные → интеллект → действие → результат' dist/dex-immediate.html
          echo 'Production artifact verification: PASS'

      - name: Validate root routing contract
        run: |
          grep -q 'run_worker_first' wrangler.jsonc
          grep -q '"run_worker_first": true' wrangler.jsonc
          grep -q "new Request(new URL('/dex-immediate'," src/index.js
          ! grep -q 'ASSETS.fetch.*dex-immediate.html' src/index.js
          echo 'Root routing contract: PASS'

      - name: Check artifact size budget
        run: |
          total_kb=$(du -sk dist | cut -f1)
          html_kb=$(du -k dist/dex-immediate.html | cut -f1)
          echo "dist total: ${total_kb} KB"
          echo "Immediate HTML: ${html_kb} KB"
          test "$total_kb" -le 8192
          test "$html_kb" -le 512
          echo 'Performance budget: PASS'

      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 check

      - name: Validate deployment graph
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Start local Worker for browser QA
        run: |
          nohup npx --yes wrangler@4 dev --local --port 8788 > /tmp/synapsemax-worker.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8788/ >/dev/null

      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Run real browser UX gate
        env:
          SYNAPSEMAX_BROWSER_URL: http://127.0.0.1:8788
        run: npx playwright test scripts/browser-qa.spec.mjs --reporter=line

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: immediate-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
