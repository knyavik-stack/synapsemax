name: Immediate QA
on:
  push:
    branches: ['rebase/immediate-product']
  pull_request:
    branches: ['main']
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:immediate
      - run: npm run build
