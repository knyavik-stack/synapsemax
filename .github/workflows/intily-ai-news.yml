name: Intily AI News Publisher

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: intily-ai-news-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run news engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHAT_ID: '@intily'
          STATE_FILE: data/intily-ai-news-state.json
        run: timeout 240s python3 scripts/intily_ai_news.py
      - name: Persist state
        if: always()
        run: |
          if git diff --quiet -- data/intily-ai-news-state.json; then
            echo 'No state changes.'
            exit 0
          fi
          git config user.name 'intily-ai-news[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/intily-ai-news-state.json
          git commit -m 'chore(news): persist publisher state' || true
          git push
