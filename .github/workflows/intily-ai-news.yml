name: Intily AI News Publisher

on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intily-ai-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish important AI news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@intilyshop'
        run: |
          python3 - <<'PY'
          import hashlib, html, json, os, re, subprocess, sys, time
          import urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          STATE='data/intily-ai-news-state.json'
          os.makedirs('data', exist_ok=True)
          try:
              with open(STATE, encoding='utf-8') as f: state=json.load(f)
          except Exception:
              state={'published':[]}
          published=set(state.get('published',[]))

          def get(url, timeout=20):
              req=urllib.request.Request(url, headers={'User-Agent':'IntilyAI-NewsBot/2.0'})
              with urllib.request.urlopen(req, timeout=timeout) as r: return r.read()

          def translate(text):
              text=re.sub(r'\s+',' ',text or '').strip()
              if not text: return ''
              # Russian sources do not need translation; this also removes an avoidable external dependency.
              cyr=len(re.findall(r'[А-Яа-яЁё]',text))
              lat=len(re.findall(r'[A-Za-z]',text))
              if cyr >= 20 and cyr >= max(1, lat*1.2):
                  return text
              # Primary translator with retry, then independent public fallbacks.
              for attempt in range(2):
                  try:
                      q=urllib.parse.urlencode({'client':'gtx','sl':'auto','tl':'ru','dt':'t','q':text[:4500]})
                      data=json.loads(get('https://translate.googleapis.com/translate_a/single?'+q,15).decode('utf-8'))
                      out=''.join(x[0] for x in data[0] if x and x[0]).strip()
                      if out: return out
                  except Exception as e:
                      print('google translation retry',attempt+1,e); time.sleep(3*(attempt+1))
              for host in ['https://lingva.ml','https://translate.thedaviddelta.com','https://lingva.garudalinux.org']:
                  try:
                      path='/api/v1/en/ru/'+urllib.parse.quote(text[:3500],safe='')
                      data=json.loads(get(host+path,20).decode('utf-8'))
                      out=(data.get('translation') or '').strip()
                      if out: return out
                  except Exception as e:
                      print('lingva fallback error',host,e)
              try:
                  q=urllib.parse.urlencode({'q':text[:3500],'langpair':'en|ru'})
                  data=json.loads(get('https://api.mymemory.translated.net/get?'+q,20).decode('utf-8'))
                  out=((data.get('responseData') or {}).get('translatedText') or '').strip()
                  if out and out.lower()!=text.lower(): return out
              except Exception as e:
                  print('mymemory fallback error:',e)
              return None

          def clean_ru(text):
              text=re.sub(r'\s+',' ',text or '').strip()
              text=re.sub(r'\b(согласно|отмечается|в свою очередь|таким образом),?\s*','',text,flags=re.I)
              return text.strip(' .—-')

          def require_russian(text, field):
              text=re.sub(r'https?://\S+','',text or '')
              cyr=len(re.findall(r'[А-Яа-яЁё]',text))
              lat=len(re.findall(r'[A-Za-z]',text))
              if cyr < 8 or cyr < max(1, lat*0.8):
                  raise RuntimeError(f'Russian {field} validation failed; publication blocked')
              return text

          def parse_dt(value):
              if not value: return None
              try:
                  from email.utils import parsedate_to_datetime
                  d=parsedate_to_datetime(value)
                  return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
              except Exception: return None

          now=datetime.now(timezone.utc)
          cutoff=now-timedelta(hours=24)
          candidates=[]
          queries=[
            ('WORLD','AI artificial intelligence OpenAI Anthropic Google DeepMind Microsoft Meta Nvidia'),
            ('WORLD','AI model launch release agent robotics chips regulation safety'),
            ('RUSSIA','ИИ искусственный интеллект нейросети Россия Яндекс Сбер VK'),
            ('RUSSIA','ИИ нейросети регулирование технологии инвестиции разработка Россия')
          ]

          for region,q in queries:
              for start in (0,10,20,30):
                  params={'q':q,'hl':'ru-RU','gl':'RU' if region=='RUSSIA' else 'US','ceid':'RU:ru' if region=='RUSSIA' else 'US:en'}
                  url='https://news.google.com/rss/search?'+urllib.parse.urlencode(params)+'&when=1d&start='+str(start)
                  try: root=ET.fromstring(get(url,20))
                  except Exception as e:
                      print('feed error',region,start,e); continue
                  items=root.findall('./channel/item')
                  if not items: break
                  for it in items:
                      title=(it.findtext('title') or '').strip()
                      link=(it.findtext('link') or '').strip()
                      desc=html.unescape(re.sub(r'<[^>]+>',' ',it.findtext('description') or '')).strip()
                      pub=it.findtext('pubDate') or ''
                      dt=parse_dt(pub)
                      if not title or not link or not dt or dt < cutoff: continue
                      source_el=it.find('source'); source=(source_el.text or '').strip() if source_el is not None else ''
                      key=hashlib.sha256((re.sub(r'\W+',' ',title.lower())+'|'+link.split('&')[0]).encode()).hexdigest()
                      if key in published: continue
                      blob=(title+' '+desc+' '+source).lower()
                      score=0
                      weights=[('launch',6),('released',5),('release',5),('model',4),('agent',5),('breakthrough',7),('research',3),('security',5),('safety',5),('regulation',5),('law',5),('investment',4),('billion',5),('acquisition',5),('chip',4),('gpu',4),('openai',4),('anthropic',4),('google',3),('deepmind',4),('nvidia',4),('microsoft',3),('yandex',4),('sber',4),('сбер',4),('яндекс',4),('закон',6),('регулир',5),('миллиард',5),('запуст',5),('выпуст',5),('агент',5),('модель',4),('нейросет',4),('исследован',3)]
                      for term,pts in weights:
                          if term in blob: score+=pts
                      if source.lower() in {'reuters','associated press','the verge','techcrunch','bloomberg','financial times','tass','interfax','рбк','коммерсантъ'}: score+=3
                      age_hours=max(0,(now-dt).total_seconds()/3600)
                      if age_hours <= 2: score+=2
                      if age_hours > 12: score-=1
                      candidates.append({'region':region,'title':title,'desc':desc,'link':link,'source':source,'pub':dt.isoformat(),'key':key,'score':score})

          candidates.sort(key=lambda x:(x['score'],x['pub']),reverse=True)
          unique=[]; seen_titles=[]
          for c in candidates:
              norm=re.sub(r'[^a-zа-я0-9]+',' ',c['title'].lower()).strip()
              if any(norm==s or (len(norm)>35 and (norm in s or s in norm)) for s in seen_titles): continue
              seen_titles.append(norm); unique.append(c)

          important=[c for c in unique if c['score']>=8]
          batch=important[:5]
          if not batch:
              print('No important unseen AI news in rolling 24h window')
              sys.exit(0)

          def conclusion(c):
              b=(c['title']+' '+c['desc']).lower()
              if any(x in b for x in ['launch','released','release','model','выпуст','запуст','модель']): return 'Технология вышла на новый этап, поэтому её влияние стоит оценивать не по громкости анонса, а по тому, что теперь реально смогут делать пользователи и компании.'
              if any(x in b for x in ['regulation','law','закон','регулир']): return 'Правила игры для AI становятся жёстче. Для компаний это означает дополнительные требования к продуктам, данным и процессам.'
              if any(x in b for x in ['investment','billion','инвестиц','миллиард']): return 'Деньги продолжают идти в AI, а значит конкуренция за вычисления, модели и талант будет только усиливаться.'
              if any(x in b for x in ['security','safety','безопас','агент']): return 'Чем самостоятельнее становятся AI-системы, тем важнее контроль, безопасность и понятные границы их действий.'
              return 'Событие показывает, куда сейчас движется AI-рынок и какие технологии могут стать значимыми уже в ближайшее время.'

          def send(c):
              translated_title=translate(c['title'])
              translated_desc=translate(c['desc'])
              if not translated_title or not translated_desc:
                  raise RuntimeError('Russian translation unavailable; publication blocked')
              ru_title=require_russian(clean_ru(translated_title), 'title')
              ru_desc=require_russian(clean_ru(translated_desc), 'body')
              if not ru_title or not ru_desc:
                  raise RuntimeError('Russian editorial text incomplete; publication blocked')
              if len(ru_desc)>900: ru_desc=ru_desc[:900].rsplit(' ',1)[0]+'…'
              flag='🌍' if c['region']=='WORLD' else '🇷🇺'
              joke=''
              if c['score']>=12 and any(x in (c['title']+' '+c['desc']).lower() for x in ['launch','released','выпуст','запуст']): joke='\n\n😏 Похоже, AI снова решил не ждать понедельника.'
              msg=(f'{flag} <b>{html.escape(ru_title)}</b>\n\n'
                   f'{html.escape(ru_desc)}\n\n'
                   f'<b>Что это значит:</b> {html.escape(conclusion(c))}'
                   f'{joke}\n\n'
                   f'📰 {html.escape(c["source"] or "Источник")} · {c["pub"][:16].replace("T"," ")} UTC\n'
                   f'🔗 <a href="{html.escape(c["link"], quote=True)}">Подробнее</a>')
              final_text_for_check=re.sub(r'<[^>]+>',' ',msg)
              require_russian(final_text_for_check, 'post')
              payload=json.dumps({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':msg,'parse_mode':'HTML','disable_web_page_preview':True}).encode()
              req=urllib.request.Request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendMessage',data=payload,headers={'Content-Type':'application/json'})
              last=None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r: data=json.loads(r.read().decode())
                      if not data.get('ok'): raise RuntimeError(data)
                      return ru_title
                  except Exception as e:
                      last=e; print('telegram retry',attempt+1,e); time.sleep(2*(attempt+1))
              raise last

          for c in batch:
              try:
                  print('Publishing:',c['title'],'score=',c['score'],'published=',c['pub'])
                  print('RU:',send(c))
                  published.add(c['key'])
                  time.sleep(2)
              except Exception as e:
                  print('publish error',e)
                  break

          state['published']=list(published)[-1000:]
          with open(STATE,'w',encoding='utf-8') as f: json.dump(state,f,ensure_ascii=False,indent=2)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',STATE],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','chore(automation): update Intily AI news dedup state'],check=True)
              subprocess.run(['git','push'],check=True)
          PY
