name: Intily AI News Publisher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intily-ai-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish important AI news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@intilyshop'
        run: |
          python3 - <<'PY'
          import hashlib, html, json, os, re, subprocess, sys, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          STATE='data/intily-ai-news-state.json'
          os.makedirs('data', exist_ok=True)
          try:
              with open(STATE,encoding='utf-8') as f: state=json.load(f)
          except Exception: state={'published':[]}
          published=set(state.get('published',[])); candidates=[]

          def translate(text):
              text=re.sub(r'\s+',' ',text or '').strip()
              if not text: return ''
              # Google Translate's public web endpoint is used only as a translation layer; editorial wording is handled below.
              try:
                  q=urllib.parse.urlencode({'client':'gtx','sl':'auto','tl':'ru','dt':'t','q':text[:1800]})
                  data=json.loads(urllib.request.urlopen('https://translate.googleapis.com/translate_a/single?'+q,timeout=15).read())
                  return ''.join(x[0] for x in data[0] if x and x[0]).strip()
              except Exception:
                  return text

          def clean_human(text):
              text=re.sub(r'\s+',' ',text).strip()
              text=re.sub(r'\b(по словам компании|согласно сообщению|как сообщается)\b', '', text, flags=re.I)
              text=re.sub(r'\b(является важным шагом|важная веха|революционный|беспрецедентный)\b', '', text, flags=re.I)
              return re.sub(r'\s{2,}',' ',text).strip(' .—-')

          for region,q in [('WORLD','AI artificial intelligence OpenAI Anthropic Google DeepMind NVIDIA Meta Microsoft'),('RUSSIA','ИИ искусственный интеллект нейросети Яндекс Сбер VK МТС')]:
              url='https://news.google.com/rss/search?'+urllib.parse.urlencode({'q':q,'hl':'ru-RU' if region=='RUSSIA' else 'en-US','gl':'RU' if region=='RUSSIA' else 'US','ceid':'RU:ru' if region=='RUSSIA' else 'US:en'})
              try: root=ET.fromstring(urllib.request.urlopen(url,timeout=15).read())
              except Exception as e: print('feed error',region,e); continue
              for item in root.findall('./channel/item')[:20]:
                  title=(item.findtext('title') or '').strip(); link=(item.findtext('link') or '').strip(); desc=html.unescape(re.sub('<[^>]+>',' ',item.findtext('description') or '')).strip(); pub=(item.findtext('pubDate') or '').strip(); src=item.find('source'); source=(src.text or '').strip() if src is not None else ''
                  if not title or not link: continue
                  key=hashlib.sha256((re.sub(r'\W+',' ',title.lower())+'|'+link.split('&')[0]).encode()).hexdigest()
                  if key in published: continue
                  text=(title+' '+desc).lower(); score=0
                  for term,pts in [('launch',5),('released',5),('release',4),('model',3),('gpt',4),('claude',4),('gemini',4),('openai',4),('anthropic',4),('deepmind',4),('nvidia',4),('billion',4),('regulation',4),('law',4),('закон',5),('регулир',5),('млрд',4),('модель',3),('нейросет',3),('инвести',4),('сделк',4),('исследован',3),('research',3),('security',4),('безопасн',4),('agent',4),('агент',4),('breakthrough',5),('прорыв',5)]:
                      if term in text: score+=pts
                  if source.lower() in {'reuters','associated press','the verge','techcrunch','bloomberg','financial times'}: score+=3
                  if region=='RUSSIA' and any(x in text for x in ['россия','рф','россий','яндекс','сбер','vk ','мтс']): score+=3
                  candidates.append({'region':region,'title':title,'link':link,'desc':desc,'pub':pub,'source':source,'key':key,'score':score})

          if not candidates: print('No new candidates'); sys.exit(0)
          candidates.sort(key=lambda x:(x['score'],x['pub']),reverse=True); item=candidates[0]
          if item['score']<5: print('No sufficiently important new AI news; top score:',item['score']); sys.exit(0)

          ru_title=clean_human(translate(item['title']))
          ru_desc=clean_human(translate(item['desc']))
          if len(ru_desc)>650: ru_desc=ru_desc[:650].rsplit(' ',1)[0]+'…'
          flag='🌍' if item['region']=='WORLD' else '🇷🇺'
          # Editorial conclusion is deliberately short and concrete, based on the type of event detected.
          low=(item['title']+' '+item['desc']).lower()
          if any(x in low for x in ['launch','released','release','model','gpt','claude','gemini','модель','релиз','запуст']): conclusion='Если это решение действительно работает так, как заявлено, следующий вопрос — кто первым превратит его в массовый продукт.'
          elif any(x in low for x in ['regulation','law','закон','регулир']): conclusion='Вывод: правила игры для AI становятся жёстче. Для компаний это уже не теория, а прямые требования к продуктам и процессам.'
          elif any(x in low for x in ['billion','investment','funding','инвести','млрд','сделк']): conclusion='Вывод: деньги идут туда, где рынок видит реальный коммерческий потенциал. Конкуренция за AI-инфраструктуру только усиливается.'
          elif any(x in low for x in ['security','безопасн','agent','агент']): conclusion='Вывод: чем самостоятельнее становятся AI-системы, тем важнее контроль, безопасность и понятные границы их действий.'
          else: conclusion='Вывод: событие стоит отслеживать — оно может повлиять на рынок AI, продукты или правила работы с технологиями.'

          humor=''
          if item['score']>=9 and any(x in low for x in ['launch','released','release','gpt','claude','gemini','модель','релиз']): humor='\n\n🙂 Похоже, гонка AI снова ускорилась. Передышку отменяем.'
          msg=(f"{flag} <b>{html.escape(ru_title or item['title'])}</b>\n\n"
               f"{html.escape(ru_desc or translate(item['desc'])[:650])}\n\n"
               f"<b>Что это значит:</b> {html.escape(conclusion)}{html.escape(humor)}\n\n"
               f"📰 {html.escape(item['source'] or 'Источник')}\n"
               f"🔗 <a href=\"{html.escape(item['link'], quote=True)}\">Подробнее</a>")
          payload=json.dumps({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':msg,'parse_mode':'HTML','disable_web_page_preview':True}).encode()
          req=urllib.request.Request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendMessage',data=payload,headers={'Content-Type':'application/json'})
          response=json.loads(urllib.request.urlopen(req,timeout=20).read())
          if not response.get('ok'): raise SystemExit('Telegram error: '+json.dumps(response,ensure_ascii=False))
          print('Published:',ru_title or item['title'])
          published.add(item['key']); state['published']=list(published)[-500:]
          with open(STATE,'w',encoding='utf-8') as f: json.dump(state,f,ensure_ascii=False,indent=2)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True); subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True); subprocess.run(['git','add',STATE],check=True)
          if os.system('git diff --cached --quiet') != 0: subprocess.run(['git','commit','-m','chore(automation): update AI news dedup state'],check=True); subprocess.run(['git','push'],check=True)
          PY
