<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynapseMax — Client Portal</title><style>
body{margin:0;background:#070b13;color:#dbe9f8;font:14px/1.5 Inter,Arial,sans-serif}main{max-width:1180px;margin:auto;padding:40px 22px}h1{font:700 30px Orbitron,Arial;margin:0 0 8px}.muted{color:#7e91aa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.card{background:rgba(12,20,34,.86);border:1px solid rgba(100,160,255,.16);border-radius:14px;padding:20px}.value{font-size:28px;font-weight:700}.label{color:#7890aa;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-top:8px}.panel{background:rgba(12,20,34,.7);border:1px solid rgba(100,160,255,.12);border-radius:14px;padding:22px}button{background:#00d7ff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.meta div{padding:14px;border:1px solid rgba(100,160,255,.1);border-radius:10px}.meta b{display:block;font-size:18px;margin-top:4px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="muted">SYNAPSEMAX // CLIENT PORTAL</div><h1>Финансовый контур</h1><p class="muted">Фактические расчёты, сохранённые в вашем tenant-контуре. Без демонстрационных прогнозов.</p><div class="grid"><div class="card"><div id="sessions" class="value">—</div><div class="label">Диагностик</div></div><div class="card"><div id="monthly" class="value">—</div><div class="label">Базовая ценность / мес.</div></div><div class="card"><div id="roi" class="value">—</div><div class="label">Последний ROI</div></div><div class="card"><div id="payback" class="value">—</div><div class="label">Окупаемость</div></div></div><div class="panel"><strong>Экономический эффект</strong><div class="meta"><div><span class="muted">Годовой net effect</span><b id="annual">—</b></div><div><span class="muted">Рост маржи</span><b id="margin">—</b></div><div><span class="muted">Качество evidence</span><b id="evidence">—</b></div></div><p id="status" class="muted">Загрузка…</p><button id="refresh">Обновить</button></div></main><script type="module">
import { createAuthClient } from 'https://esm.sh/@neondatabase/auth@0.5.0-beta';
const auth=createAuthClient(`${window.location.origin}/api/auth`);
async function authHeaders(){ const sessionResponse=await auth.getSession(); const session=sessionResponse?.data?.session ?? sessionResponse?.session ?? null; const token=session?.token ?? null; if(!token) throw new Error('Не выполнен вход'); return {Authorization:`Bearer ${token}`,'content-type':'application/json'}; }
async function track(eventName, metadata = {}) { try { const headers=await authHeaders(); await fetch('/api/v1/portal/funnel',{method:'POST',headers,body:JSON.stringify({eventName,metadata})}); } catch {} }
track('portal_view');
const money=v=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(v))+' ₽';
async function load(){const s=document.getElementById('status');try{const r=await fetch('/api/v1/portal/summary',{headers:await authHeaders(),cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'failed');document.getElementById('sessions').textContent=j.result.sessionCount;document.getElementById('monthly').textContent=money(j.result.baseMonthlyValue);document.getElementById('annual').textContent=money(j.result.annualNetValue);document.getElementById('roi').textContent=j.result.latestRoi==null?'—':Math.round(j.result.latestRoi)+'%';document.getElementById('payback').textContent=j.result.latestPayback==null?'—':j.result.latestPayback.toFixed(1)+' мес.';document.getElementById('margin').textContent=j.result.marginUpliftPoints==null?'—':'+'+Number(j.result.marginUpliftPoints).toFixed(1)+' п.п.';document.getElementById('evidence').textContent=j.result.evidenceQuality||'—';s.textContent='Данные получены из tenant-scoped diagnostic results.'}catch(e){s.innerHTML='Не удалось загрузить данные. <a href="/auth.html" style="color:#00d7ff">Войти</a>'}}document.getElementById('refresh').onclick=()=>{track('cta_click',{cta:'refresh'});load()};load();
</script></body></html>
